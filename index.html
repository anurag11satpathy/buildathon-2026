<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tic Tac Toe</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1e1e2e; color: #eee;
         display: flex; flex-direction: column; align-items: center; margin: 0; padding: 24px; }
  h1 { margin: 0 0 12px; }
  #mode { margin-bottom: 12px; }
  select, button { font-size: 1rem; padding: 6px 12px; border-radius: 6px; border: 0; cursor: pointer; }
  #status { font-size: 1.2rem; margin: 12px 0; min-height: 1.5em; }
  #board { display: grid; grid-template-columns: repeat(3, 100px); gap: 6px; }
  .cell { width: 100px; height: 100px; font-size: 3rem; font-weight: bold;
          background: #313244; color: #eee; border-radius: 8px; }
  .cell:hover:enabled { background: #45475a; }
  .cell.X { color: #89b4fa; } .cell.O { color: #f38ba8; }
  .cell.win { background: #a6e3a1; color: #1e1e2e; }
</style>
</head>
<body>
<h1>Tic Tac Toe</h1>
<div id="mode">
  <select id="vs">
    <option value="cpu">vs Computer (you are X)</option>
    <option value="two">Two players</option>
  </select>
  <button id="reset">New game</button>
</div>
<div id="status"></div>
<div id="board"></div>

<script>
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');
const vsEl = document.getElementById('vs');
let board, player, over;

function winLine(b) {
  return LINES.find(([a, c, d]) => b[a] && b[a] === b[c] && b[a] === b[d]);
}

function minimax(b, p, me) {
  const w = winLine(b);
  if (w) return b[w[0]] === me ? 1 : -1;
  if (b.every(Boolean)) return 0;
  const other = p === 'X' ? 'O' : 'X';
  const scores = [];
  b.forEach((v, i) => {
    if (!v) { b[i] = p; scores.push(minimax(b, other, me)); b[i] = null; }
  });
  return p === me ? Math.max(...scores) : Math.min(...scores);
}

function cpuMove() {
  let best = -1, bestScore = -2;
  board.forEach((v, i) => {
    if (!v) {
      board[i] = 'O';
      const s = minimax(board, 'X', 'O');
      board[i] = null;
      if (s > bestScore) { bestScore = s; best = i; }
    }
  });
  return best;
}

function render() {
  boardEl.innerHTML = '';
  const w = winLine(board);
  board.forEach((v, i) => {
    const c = document.createElement('button');
    c.className = 'cell' + (v ? ' ' + v : '') + (w && w.includes(i) ? ' win' : '');
    c.textContent = v || '';
    c.disabled = over || !!v;
    c.onclick = () => play(i);
    boardEl.appendChild(c);
  });
  if (w) statusEl.textContent = board[w[0]] + ' wins!';
  else if (over) statusEl.textContent = "It's a draw!";
  else statusEl.textContent = player + "'s turn";
}

function play(i) {
  if (over || board[i]) return;
  board[i] = player;
  over = !!winLine(board) || board.every(Boolean);
  if (!over) player = player === 'X' ? 'O' : 'X';
  render();
  if (!over && vsEl.value === 'cpu' && player === 'O') setTimeout(() => play(cpuMove()), 300);
}

function reset() {
  board = Array(9).fill(null); player = 'X'; over = false; render();
}

document.getElementById('reset').onclick = reset;
vsEl.onchange = reset;
reset();
</script>
</body>
</html>
